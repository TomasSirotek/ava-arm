# ava-arm CI: checks that need no ROS install and none of the git-ignored model files.
#   - Config checks: the configs of all ROS packages agree (joints, limits, named poses, servo
#     calibration, torque values); tests/ with pytest.
#   - Dashboard against this repo: the dashboard submodule's unit tests, including its ROS-contract
#     tests (joint limits, effort limits, controller joints) read from this repo's ava_description.
#     They are skipped in the dashboard repo's own CI, so this is where they really run. Dependabot's
#     daily dashboard-update PRs run this too, so the pointer only moves to a compatible commit.
#   - Firmware: the ESP32-C3 servo driver's unit tests on the PC (protocol, behaviour) and a full
#     build for the board, so a firmware that does not compile cannot reach main.
# ROS build/test (colcon) is not here yet: CI has none of the git-ignored model files.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Config checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full commit SHA; the comment is the release. Dependabot bumps both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test requirements
        run: pip install -r tests/requirements.txt

      - name: pytest
        run: python -m pytest tests -ra

  dashboard:
    name: Dashboard against this repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # The dashboard reads the robot model through public/robot, a git-ignored symlink into
      # ava_description that every checkout creates (see dashboard/README.md).
      - name: Link the robot model into the dashboard
        run: ln -s ../../ros2_ws/src/ava_description dashboard/public/robot

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: dashboard/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        working-directory: dashboard
        run: >-
          pnpm exec vitest run --reporter=default --reporter=github-actions --reporter=json
          --outputFile.json="$RUNNER_TEMP/vitest.json"

      # Fails if the ROS-contract tests were skipped (e.g. the symlink above broke) instead of passing.
      - name: ROS-contract tests ran
        run: |
          jq -e '[.testResults[] | select(.name | endswith("ros-contract.test.ts")) | .assertionResults[].status]
            | length > 0 and all(. == "passed")' "$RUNNER_TEMP/vitest.json" > /dev/null
          echo "ROS-contract tests ran against ros2_ws/src/ava_description and passed."

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firmware/ava_servo_driver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: firmware/ava_servo_driver/requirements.txt

      - name: Install PlatformIO
        run: pip install -r requirements.txt

      # No cache for ~/.platformio on purpose: the ESP32 toolchains it downloads are ~5 GB, more
      # than a fresh download takes (~2 min) and half of GitHub's 10 GB cache limit per repo.

      - name: Unit tests (on the PC)
        run: pio test -e native

      - name: Build for the ESP32-C3
        run: pio run -e esp32c3

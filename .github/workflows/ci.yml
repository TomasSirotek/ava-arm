# CI: config tests, dashboard tests against this repo, firmware tests + ESP32-C3 build (no ROS needed).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Config checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to commit SHAs; Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test requirements
        run: pip install -r tests/requirements.txt

      - name: pytest
        run: python -m pytest tests -ra

  dashboard:
    name: Dashboard against this repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # The dashboard reads the robot model through the git-ignored public/robot symlink.
      - name: Link the robot model into the dashboard
        run: ln -s ../../ros2_ws/src/ava_description dashboard/public/robot

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: dashboard/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        working-directory: dashboard
        run: >-
          pnpm exec vitest run --reporter=default --reporter=github-actions --reporter=json
          --outputFile.json="$RUNNER_TEMP/vitest.json"

      # Fails if the ROS-contract tests were skipped (e.g. the symlink above broke) instead of passing.
      - name: ROS-contract tests ran
        run: |
          jq -e '[.testResults[] | select(.name | endswith("ros-contract.test.ts")) | .assertionResults[].status]
            | length > 0 and all(. == "passed")' "$RUNNER_TEMP/vitest.json" > /dev/null
          echo "ROS-contract tests ran against ros2_ws/src/ava_description and passed."

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firmware/ava_servo_driver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: firmware/ava_servo_driver/requirements.txt

      - name: Install PlatformIO
        run: pip install -r requirements.txt

      - name: Unit tests (on the PC)
        run: pio test -e native

      - name: Build for the ESP32-C3
        run: pio run -e esp32c3

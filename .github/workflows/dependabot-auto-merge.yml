# Turns on auto-merge for Dependabot's dashboard-submodule PRs: GitHub merges them as soon as the
# required CI checks (ruleset "Protect main") pass, and leaves them open if they fail.
# Other Dependabot PRs (workflow actions) stay for a manual review.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge dashboard update
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        if: steps.meta.outputs.package-ecosystem == 'gitsubmodule'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

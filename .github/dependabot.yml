# Dependabot version updates for ava-arm.
version: 2
updates:
  # Dashboard submodule: daily; auto-merged when CI passes.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(dashboard)"

  # Workflow actions: weekly, one grouped PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # PlatformIO (firmware/ava_servo_driver/requirements.txt): weekly.
  - package-ecosystem: pip
    directory: /firmware/ava_servo_driver
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(firmware)"

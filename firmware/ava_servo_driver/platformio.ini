; Ava servo driver (ESP32-C3 + PCA9685). See README.md.

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; used by lib/pca9685_output only
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@3.0.3
build_flags = -Wall -Wextra
; the unit tests run on the PC only
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
; Arduino-only module, not testable on the PC
lib_ignore = pca9685_output

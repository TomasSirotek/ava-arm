controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

joint_trajectory_controller:
  ros__parameters:
    joints:
      - Revolute 1
      - Revolute 2
      - Revolute 3
      - Revolute 4
      - Revolute 5
      - Revolute 6
      - Revolute 7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.5
    use_sim_time: true
    
    gains:
      "Revolute 1": {p: 200.0, i: 1.0, d: 20.0, i_clamp: 10.0}
      "Revolute 2": {p: 300.0, i: 1.0, d: 30.0, i_clamp: 10.0}
      "Revolute 3": {p: 200.0, i: 1.0, d: 20.0, i_clamp: 10.0}
      "Revolute 4": {p: 150.0, i: 0.5, d: 15.0, i_clamp: 10.0}
      "Revolute 5": {p: 100.0, i: 0.5, d: 10.0, i_clamp: 10.0}
      "Revolute 6": {p: 100.0, i: 0.5, d: 10.0, i_clamp: 5.0}
      "Revolute 7": {p: 100.0, i: 0.5, d: 10.0, i_clamp: 5.0}

controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_roll
      - wrist_flex
      - gripper
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.5
    use_sim_time: true
    
    gains:
      "shoulder_pan": {p: 200.0, i: 1.0, d: 20.0, i_clamp: 10.0}
      "shoulder_lift": {p: 300.0, i: 1.0, d: 30.0, i_clamp: 10.0}
      "elbow_flex": {p: 200.0, i: 1.0, d: 20.0, i_clamp: 10.0}
      "wrist_roll": {p: 150.0, i: 0.5, d: 15.0, i_clamp: 10.0}
      "wrist_flex": {p: 100.0, i: 0.5, d: 10.0, i_clamp: 10.0}
      "gripper": {p: 100.0, i: 0.5, d: 10.0, i_clamp: 5.0}

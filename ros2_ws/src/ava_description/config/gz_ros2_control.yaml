controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - "shoulder_pan"
      - "shoulder_lift"
      - "elbow_flex"
      - "wrist_roll"
      - "wrist_flex"
      - "gripper"
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    gains:
      "shoulder_pan": {p: 1000.0, i: 10.0, d: 10.0, i_clamp: 100.0}
      "shoulder_lift": {p: 1000.0, i: 10.0, d: 10.0, i_clamp: 100.0}
      "elbow_flex": {p: 1000.0, i: 10.0, d: 10.0, i_clamp: 100.0}
      "wrist_roll": {p: 1000.0, i: 10.0, d: 10.0, i_clamp: 100.0}
      "wrist_flex": {p: 500.0, i: 5.0, d: 5.0, i_clamp: 10.0}
      "gripper": {p: 100.0, i: 1.0, d: 1.0, i_clamp: 10.0}

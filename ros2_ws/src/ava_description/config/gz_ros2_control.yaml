controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - "Revolute 1"
      - "Revolute 2"
      - "Revolute 3"
      - "Revolute 4"
      - "Revolute 5"
      - "Revolute 6"
      - "Revolute 7"
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    gains:
      "Revolute 1": {p: 1000.0, i: 10.0, d: 10.0, i_clamp: 100.0}
      "Revolute 2": {p: 1000.0, i: 10.0, d: 10.0, i_clamp: 100.0}
      "Revolute 3": {p: 1000.0, i: 10.0, d: 10.0, i_clamp: 100.0}
      "Revolute 4": {p: 1000.0, i: 10.0, d: 10.0, i_clamp: 100.0}
      "Revolute 5": {p: 500.0, i: 5.0, d: 5.0, i_clamp: 10.0}
      "Revolute 6": {p: 100.0, i: 1.0, d: 1.0, i_clamp: 10.0}
      "Revolute 7": {p: 100.0, i: 1.0, d: 1.0, i_clamp: 10.0}
